name: expense-api

services:
  api:
    build: .
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/expense
      DATABASE_USERNAME: expense
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-local-dev-only}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "4", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 60s

  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: expense
      POSTGRES_USER: expense
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-local-dev-only}
    networks:
      - backend
    volumes:
      - expense-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U expense -d expense"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  backend:
    internal: true

volumes:
  expense-postgres:
