server:
  servlet:
    session:
      timeout: 7d
      tracking-modes: cookie
      cookie:
        name: expense-session
        http-only: true
        same-site: lax
        max-age: 7d

expense:
  bootstrap:
    enabled: false

spring:
  application:
    name: expense-api
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/expense}
    username: ${DATABASE_USERNAME:expense}
    password: ${DATABASE_PASSWORD:local-dev-only}
    hikari:
      connection-timeout: 2000
      validation-timeout: 1000
      data-source-properties:
        connectTimeout: 2
        socketTimeout: 3
  flyway:
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
