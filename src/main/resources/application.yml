spring:
  application:
    name: expense-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/expense}
    username: ${DATABASE_USERNAME:expense}
    password: ${DATABASE_PASSWORD:local-dev-only}
  flyway:
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: never
      show-details: never
